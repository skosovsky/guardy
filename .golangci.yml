version: "2"

run:
  timeout: 5m
  tests: true

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/skosovsky/guardy

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gocritic
    - revive
    - gosec
    - testifylint
    - unconvert
    - sloglint
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
    gosec:
      severity: medium
      confidence: medium
  exclusions:
    rules:
      - path: '(.+)_test\.go$'
        linters:
          - errcheck
          - gosec
          - revive
      - path: vendor/
        text: ".*"

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
