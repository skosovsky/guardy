name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: set-matrix
        run: |
          MODULES=$(find . -type d \( -name ".*" -not -name "." -o -name "vendor" \) -prune -o -type f -name "go.mod" -exec dirname {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

  lint:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  test:
    name: Test
    needs: [prepare-matrix, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          cache: true
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -v -race ./...

  release-candidate:
    name: Independent candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install release verifier linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Test release isolation and failure cleanup
        run: make release-test
      - name: Verify independent core
        env:
          GOWORK: 'off'
        run: go test -mod=readonly -race ./...
      - name: Prepare unpublished candidate
        run: make release-prepare VERSION=v0.12.0 CANDIDATE="$RUNNER_TEMP/guardy-candidate"
      - name: Verify every module and artifact consumer
        run: make release-verify CANDIDATE="$RUNNER_TEMP/guardy-candidate"

  downstream-conformance:
    name: Downstream conformance (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [sources, published]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: integration/downstream/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Verify actual execution and producer boundaries
        run: python3 scripts/downstream_conformance.py ${{ matrix.mode }} --output "$RUNNER_TEMP/downstream-${{ matrix.mode }}"
      - name: Retain dependency selection and semantic test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: downstream-${{ matrix.mode }}
          path: ${{ runner.temp }}/downstream-${{ matrix.mode }}
